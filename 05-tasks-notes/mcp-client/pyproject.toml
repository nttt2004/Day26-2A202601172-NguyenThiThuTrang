[project]
name = "tasks-notes-mcp-client"
version = "0.1.0"
description = "Tasks-Notes Agent using Google ADK with remote tasks-notes MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # google-adk hiện yêu cầu mcp 1.x (mcp.shared.session / FastMCP).
    # Các server của lab dùng mcp 2.x (MCPServer) và chạy ở môi trường RIÊNG
    # -> tạo venv riêng cho client, xem README.
    "google-adk",
    "mcp<2",
    "python-dotenv>=1.1.1",
    "httpx>=0.28.1",
]
